<div class="app-table-wrapper" [class.scrollable]="scrollHeight === 'flex'">
    <p-table
        [value]="loading ? skeletonArray : data"
        [columns]="columns"
        [dataKey]="dataKey"
        [lazy]="true"
        [paginator]="paginator && !loading && data && data.length > 0"
        [rows]="rows"
        [rowsPerPageOptions]="rowsPerPageOptions"
        [totalRecords]="totalRecords !== null ? totalRecords : (data ? data.length : 0)"
        [scrollable]="!!scrollHeight"
        [scrollHeight]="scrollHeight || ''"
        [tableStyle]="{ 'min-width': '100%' }"
        styleClass="app-primeng-table"
        [showCurrentPageReport]="true"
        currentPageReportTemplate="Hiển thị {first} – {last} trên tổng số {totalRecords} bản ghi"
        [paginatorDropdownAppendTo]="'body'"
        (onPage)="onTableChange($event)"
        (onSort)="onTableChange($event)"
    >
        <!-- ============ HEADER ============ -->
        <ng-template pTemplate="header" let-columns>
            <tr>
                <th
                    *ngFor="let col of columns"
                    [style.width]="col.width || null"
                    [style.minWidth]="col.minWidth || null"
                    [pSortableColumn]="col.sortable ? col.field : null"
                    [class]="'app-table-th ' + (col.headerClass || '')"
                >
                    <div class="th-content">
                        <span class="th-label">{{ col.header }}</span>
                        <p-sortIcon class="th-sort-icon" *ngIf="col.sortable" [field]="col.field"></p-sortIcon>
                    </div>
                </th>
            </tr>
        </ng-template>

        <!-- ============ BODY ============ -->
        <ng-template pTemplate="body" let-row let-columns="columns" let-i="rowIndex">
            <!-- Skeleton Rows -->
            <tr *ngIf="loading" class="skeleton-row">
                <td *ngFor="let col of columns">
                    <div class="skeleton-box"></div>
                </td>
            </tr>

            <!-- Data Rows -->
            <tr
                *ngIf="!loading"
                class="data-row"
                (mouseenter)="onRowHover(row[dataKey])"
                (mouseleave)="onRowLeave()"
            >
                <td
                    *ngFor="let col of columns"
                    [style.textAlign]="col.align || 'left'"
                    [class]="'app-table-td ' + (col.cellClass || '')"
                >
                    <ng-container *ngIf="templateMap[col.field]; else defaultCell">
                        <ng-container
                            *ngTemplateOutlet="templateMap[col.field]; context: { $implicit: getCellValue(row, col.field), row: row, $index: i }"
                        ></ng-container>
                    </ng-container>

                    <ng-template #defaultCell>
                        <span *ngIf="col.type === 'date'" class="cell-text">
                            {{ formatDate(getCellValue(row, col.field)) }}
                        </span>
                        <span *ngIf="col.type === 'datetime'" class="cell-text">
                            {{ formatDatetime(getCellValue(row, col.field)) }}
                        </span>
                        <span *ngIf="col.type === 'number'" class="cell-text cell-number">
                            {{ formatNumber(getCellValue(row, col.field)) }}
                        </span>
                        <span
                            *ngIf="col.type === 'badge'"
                            class="cell-badge"
                            [ngClass]="col.badgeClass ? col.badgeClass(getCellValue(row, col.field), row) : 'badge-gray'"
                        >
                            {{ getCellValue(row, col.field) ?? '—' }}
                        </span>
                        <span
                            *ngIf="!col.type || col.type === 'text' || col.type === 'custom'"
                            class="cell-text"
                            [title]="getCellValue(row, col.field)"
                        >
                            {{ getCellValue(row, col.field) ?? '—' }}
                        </span>
                    </ng-template>
                </td>
            </tr>
        </ng-template>

        <!-- ============ EMPTY STATE ============ -->
        <ng-template pTemplate="emptymessage" let-columns>
            <tr *ngIf="!loading">
                <td [attr.colspan]="columns.length" class="empty-state-cell">
                    <div class="empty-state">
                        <span class="material-symbols-outlined empty-icon">database_off</span>
                        <p class="empty-text">{{ emptyMessage }}</p>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
