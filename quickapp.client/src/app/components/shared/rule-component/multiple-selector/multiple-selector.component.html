<div class="form-group" [ngClass]="customClass">
  <label *ngIf="label" [for]="id" class="control-label">
    {{ label }}
    <span *ngIf="required" class="text-danger">*</span>
  </label>

  <ng-select [id]="id" [items]="items" [bindValue]="bindValue" [bindLabel]="bindLabel" [placeholder]="placeholder"
    [disabled]="disabled" [readonly]="readonly" [clearable]="clearable" [searchable]="searchable"
    [virtualScroll]="virtualScroll" [multiple]="true" [closeOnSelect]="closeOnSelect" [hideSelected]="hideSelected"
    [maxSelectedItems]="maxSelectedItems" [ngModel]="value" [class.is-invalid]="hasError" [searchFn]="customSearchFn"
    [appendTo]="appendTo" (ngModelChange)="onSelectionChange($event)" (focus)="onSelectionFocus($event)"
    (blur)="onSelectionBlur($event)" (clear)="onSelectionClear()" (open)="onSelectionOpen()"
    (close)="onSelectionClose()" (search)="onSearch($event)" [notFoundText]="notFoundText" (add)="onItemAdd($event)"
    (remove)="onItemRemove($event)">
    <!-- Select All Header -->
    <ng-template ng-header-tmp *ngIf="canShowSelectAll">
      <div class="select-all-container" (click)="toggleSelectAll()">
        <input type="checkbox" class="select-all-checkbox" [checked]="isAllSelected"
          [indeterminate]="isPartiallySelected" />
        <span class="select-all-label">
          {{ isAllSelected ? 'Bỏ chọn tất cả' : 'Chọn tất cả' }}
        </span>
      </div>
    </ng-template>

    <!-- Custom Not Found Template -->
    <ng-template ng-notfound-tmp let-search="searchTerm">
      <div class="empty-state-container">
        <i class="material-symbols-outlined empty-state-icon">inbox</i>
        <p class="empty-state-text">
          <ng-container *ngIf="items?.length; else emptyList">
            {{ notFoundText }}
          </ng-container>
          <ng-template #emptyList>Danh sách trống</ng-template>
        </p>
        <p *ngIf="search" class="empty-state-subtext">
          Không tìm thấy kết quả cho "{{ search }}"
        </p>
      </div>
    </ng-template>
  </ng-select>

  <div *ngIf="hasError" class="has-error m-b-12">
    <div *ngFor="let message of errorMessages" class="tw-text-[#B91C1C]">
      {{ message }}
    </div>
  </div>
</div>
