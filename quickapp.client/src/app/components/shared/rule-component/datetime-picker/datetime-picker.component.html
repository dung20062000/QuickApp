<div class="form-group" [ngClass]="customClass">
    <label *ngIf="label" [for]="id" class="control-label">
        {{ label }}
        <span *ngIf="required" class="text-danger">*</span>
    </label>

    <div class="input-group">
        <input
            [id]="id"
            type="text"
            bsDatepicker
            #datetimePicker="bsDatepicker"
            class="form-control"
            [class.is-invalid]="hasError"
            [placeholder]="placeholder"
            [ngModel]="value"
            (ngModelChange)="onDatetimeChange($event)"
            [disabled]="disabled"
            [readonly]="readonly"
            [autofocus]="autofocus"
            [minDate]="minDate"
            [maxDate]="maxDate"
            [bsConfig]="bsConfig"
            (focus)="onInputFocus($event)"
            (blur)="onInputBlur($event)"
            (bsValueChange)="onDatetimeChange($event)"
            (onShown)="onPickerOpen()"
            (onHidden)="onPickerClose()"
        />
        <div class="input-actions">
            <app-icon-button
                *ngIf="showClearButton && value && !disabled && !readonly"
                variant="ghost"
                icon="close"
                size="sm"
                (buttonClick)="clearDatetime()"
                class="btn-clear"
                title="Xóa"
            />
            <app-icon-button
                class="btn-calendar"
                (buttonClick)="toggleDatetimePicker(datetimePicker)"
                [attr.aria-expanded]="datetimePicker.isOpen"
                [style.cursor]="disabled || readonly ? 'not-allowed' : 'pointer'"
                icon="calendar_today"
                size="sm"
                variant="ghost"
                title="Chọn ngày giờ"
            />
        </div>
    </div>

    <div *ngIf="hasError" class="has-error m-b-12">
        <div *ngFor="let message of errorMessages" class="tw-text-[#B91C1C]">
            {{ message }}
        </div>
    </div>
</div>
