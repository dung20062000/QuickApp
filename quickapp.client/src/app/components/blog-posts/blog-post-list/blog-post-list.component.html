<div class="blog-post-list-wrapper">
  <!-- Page Header -->
  <div class="page-header">
    <div class="header-title">
      <h1 class="page-title">
        <span class="material-symbols-outlined" style="font-size: 22px; color: #183883;">article</span>
        Quản lý Bài viết
      </h1>
      <p class="page-subtitle">Danh sách các bài viết trên blog</p>
    </div>
    <app-button
      variant="blue"
      leftIcon="add"
      size="md"
      title="Thêm bài viết mới"
      (buttonClick)="onCreate()"
    >Thêm bài viết mới</app-button>
  </div>

  <!-- Table -->
  <app-table
    [data]="blogPosts"
    [columns]="columns"
    [loading]="loading"
    [totalRecords]="totalRecords"
    [rows]="rows"
    [paginator]="true"
    [dataKey]="'id'"
    [skeletonRows]="5"
    (tableChange)="onTableChange($event)"
    emptyMessage="Không tìm thấy bài viết nào"
  >
    <!-- STT Column -->
    <ng-template appTableTemplate="id" let-value let-row="row" let-i="$index">
      <div class="stt-cell">{{ getStt(i) }}</div>
    </ng-template>

    <!-- Thumbnail Image Column -->
    <ng-template appTableTemplate="thumbnailImage" let-value let-row="row">
      <div class="thumbnail-cell">
        @if (getImageUrl(row); as imgUrl) {
          <img
            [src]="imgUrl"
            [alt]="row.title"
            class="thumbnail-img"
            (error)="onImageError($event)"
          />
        } @else {
          <div class="thumbnail-placeholder">
            <span class="material-symbols-outlined">image</span>
          </div>
        }
      </div>
    </ng-template>

    <!-- Title Column -->
    <ng-template appTableTemplate="title" let-value let-row="row">
      <div class="title-cell" [title]="value">{{ value }}</div>
    </ng-template>

    <!-- Status Badge Column -->
    <ng-template appTableTemplate="isAvailable" let-value let-row="row">
      <span class="cell-badge" [ngClass]="getStatusClass(value)">
        <span class="badge-dot"></span>
        {{ getStatusLabel(value) }}
      </span>
    </ng-template>

    <!-- Actions Column -->
    <ng-template appTableTemplate="actions" let-value let-row="row">
      <div class="actions-cell">
        <app-icon-button
          variant="blueLight"
          size="sm"
          icon="visibility"
          toolTip="Xem chi tiết"
          (buttonClick)="onView(row)"
        ></app-icon-button>
        <app-icon-button
          variant="greenLight"
          size="sm"
          icon="edit"
          toolTip="Chỉnh sửa"
          (buttonClick)="onEdit(row)"
        ></app-icon-button>
        <app-icon-button
          variant="redLight"
          size="sm"
          icon="delete"
          toolTip="Xóa"
          (buttonClick)="onDelete(row)"
        ></app-icon-button>
      </div>
    </ng-template>
  </app-table>
</div>
